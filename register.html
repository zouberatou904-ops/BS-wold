<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Créer votre compte</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <svg class="hero-logo" viewBox="0 0 60 60">
    <rect x="2" y="2" width="56" height="56" rx="16" fill="#123330"/>
    <path d="M18 40 L18 20 M18 20 L28 20 Q35 20 35 27 Q35 33 28 33 L20 33" stroke="#1FB6A8" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 40 L44 24 L50 40" stroke="#E8B95C" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="hero-wordmark">BS <span>WOLD</span> CASH</div>

  <h1 class="title">Créer votre compte</h1>
  <p class="subtitle">Inscrivez-vous pour commencer</p>

  <form id="registerForm">

    <label for="nom">Nom complet</label>
    <div class="field-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1FB6A8" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <input type="text" id="nom" placeholder="Jean Dupont" required>
    </div>

    <label for="age">Âge</label>
    <div class="field-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1FB6A8" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <input type="number" id="age" placeholder="28" min="16" max="99" required>
    </div>

    <label>Sexe</label>
    <div class="toggle-group">
      <div class="toggle-btn active" id="btnHomme">Homme</div>
      <div class="toggle-btn" id="btnFemme">Femme</div>
    </div>
    <input type="hidden" id="sexe" value="Homme">

    <label for="whatsapp">Numéro WhatsApp</label>
    <div class="field-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1FB6A8" stroke-width="2"><path d="M3 21l1.5-4.5A8 8 0 1112 20a8 8 0 01-4.5-1.5L3 21z"/></svg>
      <input type="tel" id="whatsapp" placeholder="+229 01 23 45 67 89" required>
    </div>

    <label for="email">Email</label>
    <div class="field-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1FB6A8" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <input type="email" id="email" placeholder="jean.dupont@email.com" required>
    </div>

    <div class="security-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9aa3a1" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
      Vos données sont protégées · Aucun mot de passe requis
    </div>

    <div id="formMsg" class="form-msg"></div>

    <button type="submit" class="btn-primary" id="submitBtn">S'inscrire</button>
  </form>

  <div class="switch-link">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="register.js"></script>
</body>
</html>
