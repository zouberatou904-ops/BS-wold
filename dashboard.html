<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Tableau de bord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">BS</div>
      <div class="brand-name">WOLD <span>CASH</span></div>
    </div>
    <div class="avatar" id="avatarInitial">?</div>
  </div>

  <div class="balance-card">
    <div class="balance-label">Solde disponible</div>
    <div class="balance-amount" id="balanceK">0,00<span class="unit">K</span></div>
    <div class="balance-fcfa" id="balanceFcfa">≈ 0 FCFA</div>
  </div>

  <div class="action-grid">
    <div class="action-card teal" onclick="window.location.href='sondages.html'">
      <div class="action-icon">📋</div>
      <div>
        <div class="action-label">Sondages</div>
        <div class="action-sub" id="sondagesGain">0,00 K</div>
      </div>
    </div>
    <div class="action-card gold" onclick="window.location.href='taches.html'">
      <div class="action-icon">✅</div>
      <div>
        <div class="action-label">Tâches</div>
        <div class="action-sub" id="tachesGain">0,00 K</div>
      </div>
    </div>
    <div class="action-card purple" onclick="window.location.href='affiliation.html'">
      <div class="action-icon">🔗</div>
      <div>
        <div class="action-label">Affiliation</div>
        <div class="action-sub" id="affiliationGain">0,00 K</div>
      </div>
    </div>
    <div class="action-card gray" onclick="window.location.href='retrait.html'">
      <div class="action-icon">💸</div>
      <div>
        <div class="action-label">Retrait</div>
        <div class="action-sub">Dès 0,3 K</div>
      </div>
    </div>
  </div>

  <div class="section-title">Activité de la semaine</div>
  <div class="chart-card">
    <div class="bars" id="barsContainer"></div>
    <div class="bar-days">
      <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
    </div>
  </div>

  <button class="logout-btn" id="logoutBtn">Se déconnecter</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
