<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Connexion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <div class="brand-mark">BS</div>
    <div class="brand-name">WOLD <span>CASH</span></div>
  </div>

  <h1 class="title">Content de te revoir</h1>
  <p class="subtitle">Connecte-toi pour voir ton solde et continuer à gagner.</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="ton@email.com" required>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="Ton mot de passe" required>

    <div id="formMsg" class="form-msg"></div>

    <button type="submit" class="btn-primary" id="submitBtn">Se connecter</button>
  </form>

  <div class="switch-link">Pas encore de compte ? <a href="index.html">S'inscrire</a></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
