<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corbeau Production — Publier un produit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <a href="dashboard.html" class="back-link">← Retour</a>
  <h1 class="title">Corbeau Production</h1>
  <p class="subtitle">Publie tes produits à vendre sur Corbeau</p>

  <form id="prodForm">
    <label for="nom">Nom du produit</label>
    <input type="text" id="nom" required>

    <label for="description">Description</label>
    <input type="text" id="description" placeholder="Courte description">

    <label for="prix">Prix de vente (FCFA, prix payé par l'acheteur)</label>
    <input type="number" id="prix" min="1" required>

    <label for="stock">Quantité disponible</label>
    <input type="number" id="stock" min="1" required>

    <label for="age">Âge minimum du revendeur (0 = tout le monde)</label>
    <input type="number" id="age" min="0" value="0" required>

    <div class="file-input-wrap">
      Photo du produit
      <input type="file" id="photo" accept="image/*">
    </div>

    <div class="status-banner en_attente" style="margin-top:4px">
      ℹ️ Après envoi, l'équipe Corbeau confirme le pourcentage retenu avant la mise en ligne.
    </div>

    <div id="formMsg" class="form-msg"></div>
    <button type="submit" class="btn-primary" id="submitBtn">Proposer ce produit</button>
  </form>

  <div class="section-title" style="margin-top:30px">Mes produits proposés</div>
  <div id="myProducts"><div class="empty-history">Chargement...</div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="corbeau-production.js"></script>
</body>
</html>
