<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Parrainage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <a href="dashboard.html" class="back-link">← Retour</a>
  <h1 class="title">Parrainage</h1>
  <p class="subtitle">Invite tes proches, gagne à chaque inscription</p>

  <div class="ref-code-box">
    <div class="balance-label" style="margin-bottom:10px">Ton code de parrainage</div>
    <div class="ref-code-value" id="refCode">------</div>
  </div>

  <button class="copy-link-btn" id="copyLinkBtn">Copier mon lien d'invitation</button>
  <div class="copy-feedback" id="copyFeedback"></div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="value" id="filleulsCount">0</div>
      <div class="label">Filleuls inscrits</div>
    </div>
    <div class="stat-box">
      <div class="value" id="gainsTotal">0,00 K</div>
      <div class="label">Gains parrainage</div>
    </div>
  </div>

  <div class="how-it-works">
    <div class="how-step"><span class="num">1</span> Partage ton lien avec tes proches</div>
    <div class="how-step"><span class="num">2</span> Ils s'inscrivent via ce lien</div>
    <div class="how-step"><span class="num">3</span> Tu reçois automatiquement 0,4 K sur ton solde</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="parrainage.js"></script>
</body>
</html>
