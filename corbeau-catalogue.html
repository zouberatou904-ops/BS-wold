<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corbeau — Catalogue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <a href="dashboard.html" class="back-link">← Retour</a>
  <h1 class="title">Catalogue Corbeau</h1>
  <p class="subtitle">Choisis un produit, on te le livre à domicile</p>

  <div id="catalog"><div class="empty-history">Chargement...</div></div>

  <div class="section-title" style="margin-top:28px">Mes produits en cours</div>
  <div id="myAttributions"><div class="empty-history">Chargement...</div></div>

</div>

<div class="cb-detail-overlay" id="overlay">
  <div class="cb-detail-sheet">
    <div class="cb-detail-close" id="closeDetail">✕</div>
    <div class="cb-detail-name" id="dName"></div>
    <div class="cb-detail-price" id="dPrice"></div>
    <div class="cb-detail-commission" id="dCommission"></div>

    <label>Combien d'unités veux-tu prendre ?</label>
    <div class="qty-row">
      <div class="qty-btn" id="qtyMinus">−</div>
      <div class="qty-value" id="qtyValue">1</div>
      <div class="qty-btn" id="qtyPlus">+</div>
    </div>
    <div class="qty-total">Total à reverser après vente : <b id="qtyTotal">0 FCFA</b></div>

    <label for="adresse">Adresse de livraison</label>
    <input type="text" id="adresse" placeholder="Quartier, repère...">

    <div id="formMsg" class="form-msg"></div>
    <button class="btn-primary" id="confirmBtn" style="margin-top:14px">Je prends ce produit</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="corbeau-catalogue.js"></script>
</body>
</html>
