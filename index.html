<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Gagne plus avec une seule app</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <svg class="hero-logo" viewBox="0 0 60 60">
    <rect x="2" y="2" width="56" height="56" rx="16" fill="#123330"/>
    <path d="M18 40 L18 20 M18 20 L28 20 Q35 20 35 27 Q35 33 28 33 L20 33" stroke="#1FB6A8" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 40 L44 24 L50 40" stroke="#E8B95C" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="hero-wordmark">BS <span>WOLD</span> CASH</div>

  <h1 class="hero-title">Gagne plus avec une seule app</h1>
  <p class="hero-sub">Sondages, tâches et affiliation réunis, payés en Mobile Money.</p>

  <div class="feature-grid">
    <div class="feature-card">
      <div class="feature-value gold">300F</div>
      <div class="feature-sub">Retrait minimum</div>
    </div>
    <div class="feature-card">
      <div class="feature-value teal">Mobile Money</div>
      <div class="feature-sub">Paiement direct</div>
    </div>
    <div class="feature-card">
      <div class="feature-value purple">Auto</div>
      <div class="feature-sub">Gains automatiques</div>
    </div>
  </div>

  <a href="register.html" class="btn-primary-link">
    <button class="btn-primary">Commencer à gagner</button>
  </a>
  <a href="login.html" class="btn-outline">Se connecter</a>

  <div class="social-proof">
    <div class="proof-stack">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div>
      <div class="proof-text-main">Rejoins la communauté</div>
      <div class="proof-text-sub">Des gains chaque semaine</div>
    </div>
  </div>

</div>
</body>
</html>
