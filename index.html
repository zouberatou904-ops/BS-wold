<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Inscription</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <div class="brand-mark">BS</div>
    <div class="brand-name">WOLD <span>CASH</span></div>
  </div>

  <h1 class="title">Crée ton compte</h1>
  <p class="subtitle">Rejoins BS WOLD CASH et commence à gagner via les sondages, tâches et l'affiliation.</p>

  <form id="registerForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="ton@email.com" required>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="6 caractères minimum" minlength="6" required>

    <div id="formMsg" class="form-msg"></div>

    <button type="submit" class="btn-primary" id="submitBtn">S'inscrire</button>
  </form>

  <div class="switch-link">Déjà un compte ? <a href="login.html">Se connecter</a></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="register.js"></script>
</body>
</html>
