<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS WOLD CASH — Mon profil</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123330">
<style>
  .pf-back { display:inline-block; margin-top:14px; font-size:14px; opacity:.8; text-decoration:none; color:inherit; }
  .pf-title { font-size:26px; font-weight:800; margin:10px 0 4px; }
  .pf-sub { opacity:.7; font-size:14px; margin:0 0 22px; }
  .pf-photo { display:flex; flex-direction:column; align-items:center; gap:12px; margin:8px 0 26px; }
  .pf-avatar { position:relative; width:128px; height:128px; border-radius:50%; background:linear-gradient(135deg,#1FB6A8,#E8B95C);
    display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:800; color:#06201d;
    background-size:cover; background-position:center; border:3px solid rgba(255,255,255,.15); box-shadow:0 10px 30px rgba(31,182,168,.25); }
  .pf-cam { position:absolute; right:-2px; bottom:-2px; width:40px; height:40px; border-radius:50%; background:#1FB6A8; border:3px solid #0b1413;
    display:flex; align-items:center; justify-content:center; }
  .pf-btn { display:block; width:100%; box-sizing:border-box; padding:15px; border:0; border-radius:14px; background:#1FB6A8; color:#06201d;
    font-weight:700; font-size:16px; text-align:center; cursor:pointer; margin-top:14px; font-family:inherit; }
  .pf-btn.ghost { background:transparent; color:inherit; border:1px solid rgba(255,255,255,.2); }
  .pf-btn.small { display:inline-block; width:auto; padding:9px 16px; font-size:14px; margin:0; }
  .pf-btn:disabled { opacity:.6; }
  .pf-field { margin-bottom:16px; }
  .pf-field label { display:block; font-size:13px; opacity:.75; margin-bottom:6px; }
  .pf-field input { width:100%; box-sizing:border-box; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.35); color:inherit; font:inherit; font-size:16px; }
  .pf-field input[readonly] { opacity:.6; }
  .pf-msg { min-height:20px; font-size:14px; margin-top:12px; text-align:center; }
  .pf-msg.err { color:#ff8a8a; } .pf-msg.ok { color:#1FB6A8; }
</style>
</head>
<body>
<div class="page" style="padding-bottom:40px">
  <a class="pf-back" href="dashboard.html">← Retour</a>
  <div class="pf-title">Mon profil</div>
  <p class="pf-sub">Ton nom et ta photo, comme les autres te verront.</p>

  <div id="pfBox"><div class="empty-history">Chargement...</div></div>
</div>

<input type="file" id="pfFile" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="profil.js"></script>
</body>
</html>
